name: Deploy to Server

on:
  push:
    branches: [main] # 只有 push 到 main 分支才触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 使用通用的 Docker Login Action
      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        # 用阿里云的镜像
        with:
          registry: crpi-xga1c7tdwvfzydbb.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIBABA_USERNAME }} # 阿里云账号名
          password: ${{ secrets.ALIBABA_PASSWORD }} # 刚才设置的固定密码

      - name: Build and Push
        run: |
          # 镜像名换成阿里云的地址
          docker build -t crpi-xga1c7tdwvfzydbb.cn-hangzhou.personal.cr.aliyuncs.com/franktsui96/blog-service:latest .
          docker push crpi-xga1c7tdwvfzydbb.cn-hangzhou.personal.cr.aliyuncs.com/franktsui96/blog-service:latest

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/blog-app
            # 服务器登录
            echo "${{ secrets.ALIBABA_PASSWORD }}" | docker login crpi-xga1c7tdwvfzydbb.cn-hangzhou.personal.cr.aliyuncs.com -u "${{ secrets.ALIBABA_USERNAME }}" --password-stdin
            docker compose pull backend
            docker compose up -d backend
