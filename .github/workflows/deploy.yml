name: Deploy to Server

on:
  push:
    branches: [main] # 只有 push 到 main 分支才触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      #      - name: Login to Docker Hub
      #        uses: docker/login-action@v2
      #        with:
      #          username: ${{ secrets.DOCKERHUB_USERNAME }}
      #          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 使用通用的 Docker Login Action
      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIBABA_USERNAME }} # 阿里云账号名
          password: ${{ secrets.ALIBABA_PASSWORD }} # 刚才设置的固定密码

      #      - name: Build and Push Backend
      #        run: |
      #          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/blog-service:latest .
      #          docker push ${{ secrets.DOCKERHUB_USERNAME }}/blog-service:latest

      - name: Build and Push
        run: |
          # 镜像名换成阿里云的地址
          docker build -t registry.cn-hangzhou.aliyuncs.com/franktsui96/blog-service:latest .
          docker push registry.cn-hangzhou.aliyuncs.com/franktsui96/blog-service:latest

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/blog-app
            docker compose pull backend
            docker compose up -d backend
